<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseTrace Port Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05080c;
      --bg-card: rgba(17, 25, 40, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-cyan: #06b6d4;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-title: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
      color: var(--text-primary);
      font-family: var(--font-main);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    h1 {
      font-family: var(--font-title);
      font-size: 18px;
      font-weight: 600;
    }

    h1 span {
      color: var(--accent-cyan);
    }

    .container {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
    }

    select, input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    select option {
      background-color: #0c1017;
      color: var(--text-primary);
    }

    select:focus, input:focus {
      border-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.05);
    }

    .range-inputs {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 6px;
      color: var(--accent-cyan);
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }

    .btn:hover {
      background: rgba(6, 182, 212, 0.2);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
    }

    .btn-stop {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
    }

    .btn-stop:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--accent-red);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.25);
    }

    .progress-container {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--accent-cyan);
      height: 100%;
      width: 0%;
      transition: width 0.1s ease;
    }

    .results-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .toggle-container input {
      width: auto;
      cursor: pointer;
    }

    .table-wrapper {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: monospace;
      font-size: 13px;
      text-align: left;
    }

    th, td {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    th {
      font-family: var(--font-main);
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.01);
    }

    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      display: inline-block;
    }

    .badge-open {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .badge-closed {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .badge-filtered {
      background: rgba(239, 68, 68, 0.05);
      color: #f43f5e;
      border: 1px solid rgba(239, 68, 68, 0.15);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      gap: 12px;
      padding: 40px;
      text-align: center;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      stroke: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>PulseTrace Port Scanner &rarr; <span id="targetIp">...</span></h1>
    <div class="status-text" id="statusText">Ready</div>
  </header>

  <div class="container">
    <!-- Left panel: Controls -->
    <div class="glass-card">
      <div class="form-group">
        <label for="scanPreset">Scan Preset</label>
        <select id="scanPreset">
          <option value="common">Common Ports (Top 50)</option>
          <option value="web">Web Ports (80, 443, 8080, etc)</option>
          <option value="db">Database Ports (MySQL, MSSQL, etc)</option>
          <option value="specific">Specific Port</option>
          <option value="custom">Custom Port Range</option>
        </select>
      </div>

      <div class="form-group" id="specificPortGroup" style="display: none;">
        <label for="specificPort">Port Number</label>
        <input type="number" id="specificPort" placeholder="e.g. 80" min="1" max="65535" value="80">
      </div>

      <div class="form-group" id="customRangeGroup" style="display: none;">
        <label>Port Range</label>
        <div class="range-inputs">
          <input type="number" id="startPort" placeholder="Start" min="1" max="65535" value="1">
          <input type="number" id="endPort" placeholder="End" min="1" max="65535" value="1024">
        </div>
      </div>

      <button class="btn" id="scanBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Start Scan</span>
      </button>

      <div class="progress-container" id="progressContainer" style="display: none;">
        <div style="display: flex; justify-content: space-between; color: var(--text-secondary);">
          <span id="progressText">Scanning...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
      </div>
    </div>

    <!-- Right panel: Results -->
    <div class="glass-card results-panel">
      <div class="results-header">
        <h2 style="font-size: 14px; font-weight: 600;">Scan Results</h2>
        <label class="toggle-container">
          <input type="checkbox" id="showClosedToggle">
          <span>Show closed/filtered ports</span>
        </label>
      </div>

      <div class="table-wrapper">
        <table id="resultsTable">
          <thead>
            <tr>
              <th style="width: 100px;">Port</th>
              <th style="width: 150px;">Service</th>
              <th>Status</th>
              <th>Response</th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <!-- Dynamic rows -->
          </tbody>
        </table>
        <div class="empty-state" id="emptyState">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            <path d="M12 16v-4M12 8h.01"/>
          </svg>
          <p>No ports scanned yet. Click "Start Scan" to begin.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    // DOM Elements
    const targetIpEl = document.getElementById('targetIp');
    const statusText = document.getElementById('statusText');
    const scanPreset = document.getElementById('scanPreset');
    const customRangeGroup = document.getElementById('customRangeGroup');
    const startPortInput = document.getElementById('startPort');
    const endPortInput = document.getElementById('endPort');
    const scanBtn = document.getElementById('scanBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const progressBarFill = document.getElementById('progressBarFill');
    const resultsBody = document.getElementById('resultsBody');
    const emptyState = document.getElementById('emptyState');
    const showClosedToggle = document.getElementById('showClosedToggle');
    const specificPortGroup = document.getElementById('specificPortGroup');
    const specificPortInput = document.getElementById('specificPort');

    // Get target from URL
    const urlParams = new URLSearchParams(window.location.search);
    const target = urlParams.get('target');

    let isScanning = false;
    let scanResults = []; // Array of { port, service, status, response }

    if (!target) {
      targetIpEl.textContent = 'No Target';
      statusText.textContent = 'Error: Target not specified';
      scanBtn.disabled = true;
    } else {
      targetIpEl.textContent = target;
      document.title = 'Port Scanner - ' + target;
    }

    // Preset selection change
    scanPreset.addEventListener('change', () => {
      if (scanPreset.value === 'custom') {
        customRangeGroup.style.display = 'flex';
        specificPortGroup.style.display = 'none';
      } else if (scanPreset.value === 'specific') {
        customRangeGroup.style.display = 'none';
        specificPortGroup.style.display = 'flex';
      } else {
        customRangeGroup.style.display = 'none';
        specificPortGroup.style.display = 'none';
      }
    });

    // Start/Stop Scan Button
    scanBtn.addEventListener('click', () => {
      if (isScanning) {
        stopScan();
      } else {
        startScan();
      }
    });

    // Toggle showing closed/filtered ports
    showClosedToggle.addEventListener('change', () => {
      renderResults();
    });

    function startScan() {
      isScanning = true;
      scanResults = [];
      resultsBody.innerHTML = '';
      emptyState.style.display = 'none';
      progressContainer.style.display = 'flex';
      updateProgress(0, 0, 0);

      scanBtn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
        </svg>
        <span>Stop Scan</span>
      `;
      scanBtn.classList.add('btn-stop');
      statusText.textContent = 'Scanning...';

      const preset = scanPreset.value;
      let startPort = parseInt(startPortInput.value, 10) || 1;
      let endPort = parseInt(endPortInput.value, 10) || 1024;

      if (preset === 'specific') {
        const p = parseInt(specificPortInput.value, 10) || 80;
        startPort = p;
        endPort = p;
      }

      socket.emit('start-port-scan', {
        target,
        preset,
        startPort,
        endPort
      });
    }

    function stopScan() {
      socket.emit('stop-port-scan');
      handleScanComplete(true);
    }

    function handleScanComplete(wasStopped = false) {
      isScanning = false;
      scanBtn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Start Scan</span>
      `;
      scanBtn.classList.remove('btn-stop');
      statusText.textContent = wasStopped ? 'Scan stopped' : 'Scan complete';
      progressText.textContent = wasStopped ? 'Stopped' : 'Completed';
    }

    function updateProgress(scanned, total, currentPort) {
      const percent = total > 0 ? Math.round((scanned / total) * 100) : 0;
      progressPercent.textContent = `${percent}%`;
      progressBarFill.style.width = `${percent}%`;
      if (currentPort) {
        progressText.textContent = `Checking port ${currentPort}...`;
      }
    }

    // Socket listeners
    socket.on('port-scan-progress', (data) => {
      const { scanned, total, currentPort } = data;
      updateProgress(scanned, total, currentPort);
    });

    socket.on('port-scan-result', (result) => {
      scanResults.push(result);
      // Sort results by port number
      scanResults.sort((a, b) => a.port - b.port);
      renderResults();
    });

    socket.on('port-scan-complete', () => {
      handleScanComplete(false);
    });

    socket.on('port-scan-error', (err) => {
      statusText.textContent = 'Error: ' + err;
      handleScanComplete(true);
    });

    function renderResults() {
      resultsBody.innerHTML = '';
      const showClosed = showClosedToggle.checked;
      
      const filteredResults = scanResults.filter(r => showClosed || r.status === 'open');
      
      if (filteredResults.length === 0) {
        emptyState.style.display = 'flex';
        emptyState.querySelector('p').textContent = showClosed 
          ? 'No ports scanned yet.' 
          : 'No open ports found. (Check "Show closed/filtered ports" to see all results)';
        return;
      }

      emptyState.style.display = 'none';

      filteredResults.forEach(r => {
        const row = document.createElement('tr');
        
        let badgeClass = 'badge-closed';
        if (r.status === 'open') badgeClass = 'badge-open';
        if (r.status === 'filtered') badgeClass = 'badge-filtered';

        row.innerHTML = `
          <td style="font-weight: 600; color: ${r.status === 'open' ? 'var(--accent-cyan)' : 'var(--text-secondary)'};">${r.port}</td>
          <td>${r.service}</td>
          <td><span class="badge ${badgeClass}">${r.status}</span></td>
          <td style="color: var(--text-secondary); font-size: 12px;">${r.response || '--'}</td>
        `;
        resultsBody.appendChild(row);
      });
    }
  </script>
</body>
</html>
